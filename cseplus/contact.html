    <nav>
    <div class="nav-container">

            <a href="about.html">About Us</a>

        </div>

    <div class="container">
        <div class="card">
            <h1 style="color: var(--primary);">Contact Us</h1>
            <p>Use this form to Report a Bug, Request a Feature, or just say hello!</p>
            <form action="mailto:nnirajpanditt@gmail.com" method="GET" enctype="text/plain">
                <label>Subject Type:</label>
                <select name="subject" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border);">
                    <option value="Bug Report">🐛 Report a Bug</option>
                    <option value="Feature Request">✨ Request a Feature</option>
                    <option value="General Inquiry">💬 General Inquiry</option>
                </select>
                <label>Your Message:</label>
                <textarea name="body" rows="6" placeholder="Describe the issue or feature you'd like to see..."></textarea>
                <button type="submit">Open Email Client to Send</button>
            </form>
        </div>
    </div>
